
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Cartoon Video Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#101827;color:white;font-family:Arial}
.app{max-width:650px;margin:auto}
h2{text-align:center;color:#65e6b4}
p{color:#cbd5e1;line-height:1.5}
label{display:block;margin:14px 0 6px}
input,select,button{width:100%;padding:13px;border-radius:9px;font-size:16px}
input,select{background:#1e293b;color:white;border:1px solid #475569}
button{margin-top:10px;border:0;background:#20c997;font-weight:bold;color:#06251d}
button:disabled{opacity:.5}
canvas{width:100%;margin-top:15px;border-radius:12px;background:#8bd5ff}
#status{color:#65e6b4;margin-top:12px}
</style>
</head>
<body>
<div class="app">
<h2>🎬 Free Cartoon Video Maker</h2>
<p>Kahani likhiye aur cartoon animation video banaiye.</p>

<label>Kahani</label>
<input id="topic" value="Pyasa Kauwa">

<label>Video Size</label>
<select id="ratio">
<option value="portrait">9:16 Shorts</option>
<option value="landscape">16:9 YouTube</option>
</select>

<button onclick="startVideo()" id="start">🎥 Video Banao</button>
<button onclick="stopVideo()" id="stop" disabled>⏹ Video Download Karo</button>
<button onclick="playVoice()">🔊 Hindi Kahani Suno</button>

<canvas id="screen"></canvas>
<div id="status">Video banane ke liye button dabayein.</div>
</div>

<script>
const canvas=document.getElementById("screen");
const ctx=canvas.getContext("2d");
let running=false,recorder=null,chunks=[];
let audio=null,animation=null,startTime=0,lastSound=-1;

const story=[
"Ek din ek kauwa bahut pyasa tha.",
"Use ek ped ke neeche paani ka ghada mila.",
"Kauwe ne ek-ek karke kankad ghade mein daale.",
"Paani upar aa gaya. Kauwe ne paani piya. Seekh: Akal sabse badi taqat hai."
];

function setup(){
 let portrait=document.getElementById("ratio").value==="portrait";
 canvas.width=portrait?720:1280;
 canvas.height=portrait?1280:720;
}

function text(txt,y,size=32){
 ctx.fillStyle="#10243b";
 ctx.font="bold "+size+"px Arial";
 ctx.textAlign="center";
 ctx.fillText(txt,canvas.width/2,y);
}

function background(){
 let w=canvas.width,h=canvas.height;
 let g=ctx.createLinearGradient(0,0,0,h);
 g.addColorStop(0,"#65c7ff");
 g.addColorStop(1,"#e9f7ff");
 ctx.fillStyle=g;ctx.fillRect(0,0,w,h);

 ctx.fillStyle="#ffe16b";
 ctx.beginPath();ctx.arc(w*.83,h*.13,55,0,7);ctx.fill();

 ctx.fillStyle="#69b96d";
 ctx.beginPath();
 ctx.moveTo(0,h*.66);
 ctx.quadraticCurveTo(w*.3,h*.42,w*.55,h*.65);
 ctx.quadraticCurveTo(w*.8,h*.42,w,h*.64);
 ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();

 ctx.fillStyle="#34854a";
 ctx.fillRect(0,h*.78,w,h*.22);

 // Tree
 ctx.fillStyle="#80502b";
 ctx.fillRect(w*.72,h*.35,35,h*.44);
 ctx.fillStyle="#187b42";
 ctx.beginPath();ctx.arc(w*.74,h*.32,90,0,7);ctx.fill();
}

function drawCrow(x,y,flap){
 ctx.save();
 ctx.translate(x,y);
 ctx.fillStyle="#20252d";

 // Body
 ctx.beginPath();ctx.ellipse(0,0,48,34,0,0,7);ctx.fill();

 // Head
 ctx.beginPath();ctx.arc(37,-25,26,0,7);ctx.fill();

 // Wing
 ctx.save();
 ctx.translate(-8,-5);
 ctx.rotate(Math.sin(flap)*.35);
 ctx.fillStyle="#343c48";
 ctx.beginPath();ctx.ellipse(0,0,30,16,-.3,0,7);ctx.fill();
 ctx.restore();

 // Beak
 ctx.fillStyle="#f4a623";
 ctx.beginPath();
 ctx.moveTo(58,-25);ctx.lineTo(88,-17);ctx.lineTo(58,-11);
 ctx.fill();

 // Eye
 ctx.fillStyle="white";
 ctx.beginPath();ctx.arc(44,-31,6,0,7);ctx.fill();
 ctx.fillStyle="black";
 ctx.beginPath();ctx.arc(46,-31,3,0,7);ctx.fill();

 // Feet
 ctx.strokeStyle="#e8a02d";ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(-8,28);ctx.lineTo(-8,43);
 ctx.moveTo(15,28);ctx.lineTo(15,43);ctx.stroke();
 ctx.restore();
}

function drawPot(water){
 let w=canvas.width,h=canvas.height;
 let x=w*.72,y=h*.70;
 ctx.fillStyle="#b66a37";
 ctx.beginPath();
 ctx.moveTo(x-65,y-85);
 ctx.lineTo(x+65,y-85);
 ctx.lineTo(x+52,y+20);
 ctx.quadraticCurveTo(x,y+45,x-52,y+20);
 ctx.closePath();ctx.fill();

 ctx.fillStyle="#e5a56a";
 ctx.fillRect(x-68,y-95,136,18);

 ctx.save();
 ctx.beginPath();
 ctx.rect(x-48,y-77,96,100);ctx.clip();
 ctx.fillStyle="#28aeea";
 let level=y+15-water*70;
 ctx.fillRect(x-55,level,110,110);
 ctx.restore();

 ctx.strokeStyle="#87451e";ctx.lineWidth=5;
 ctx.beginPath();
 ctx.ellipse(x,y-85,65,10,0,0,7);ctx.stroke();
}

function drawStone(x,y){
 ctx.fillStyle="#626d79";
 ctx.beginPath();ctx.ellipse(x,y,12,9,.2,0,7);ctx.fill();
}

function render(){
 let w=canvas.width,h=canvas.height;
 let elapsed=(performance.now()-startTime)/1000;
 let scene=Math.min(3,Math.floor(elapsed/10));
 let local=elapsed%10;

 background();
 drawPot(scene>=2?Math.min(1,local/7):0);

 let crowX,crowY;
 if(scene===0){
  crowX=w*.15+local*w*.055;
  crowY=h*.42+Math.sin(local*3)*35;
  drawCrow(crowX,crowY,elapsed*8);
 }else if(scene===1){
  crowX=w*.48+Math.sin(local)*15;
  crowY=h*.49;
  drawCrow(crowX,crowY,elapsed*5);
 }else if(scene===2){
  crowX=w*.38;
  crowY=h*.48;
  drawCrow(crowX,crowY,elapsed*5);
  for(let i=0;i<5;i++){
   let stoneTime=local-i*1.3;
   if(stoneTime>0&&stoneTime<1.5){
    let sx=w*.50+Math.sin(i)*20;
    let sy=h*.30+stoneTime*stoneTime*100;
    drawStone(sx,sy);
   }
  }
 }else{
  crowX=w*.58;
  crowY=h*.55;
  drawCrow(crowX,crowY,elapsed*4);
 }

 text("Pyasa Kauwa",h*.10,canvas.width===720?37:45);

 // Subtitle
 ctx.fillStyle="rgba(0,0,0,.76)";
 ctx.fillRect(15,h*.84,w-30,h*.13);
 ctx.fillStyle="white";
 ctx.font=(w===720?25:34)+"px Arial";
 ctx.textAlign="center";
 ctx.fillText(story[scene],w/2,h*.905);

 if(running){
  if(scene!==lastSound){
   sound(440,.12);
   lastSound=scene;
  }
  if(elapsed>=40){stopVideo();return;}
  animation=requestAnimationFrame(render);
 }
}

function sound(freq,duration){
 if(!audio)return;
 let osc=audio.createOscillator();
 let gain=audio.createGain();
 osc.frequency.value=freq;
 gain.gain.setValueAtTime(.06,audio.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
 osc.connect(gain);gain.connect(audio.destination);
 gain.connect(audio.recordDestination);
 osc.start();osc.stop(audio.currentTime+duration);
}

function startAudio(){
 audio=new (window.AudioContext||window.webkitAudioContext)();
 audio.recordDestination=audio.createMediaStreamDestination();

 let osc=audio.createOscillator();
 let gain=audio.createGain();
 osc.type="sine";
 osc.frequency.value=220;
 gain.gain.value=.025;
 osc.connect(gain);
 gain.connect(audio.destination);
 gain.connect(audio.recordDestination);
 osc.start();
 audio.music=osc;
 audio.gain=gain;
}

function startVideo(){
 if(running)return;
 setup();
 running=true;chunks=[];lastSound=-1;
 startTime=performance.now();

 try{
  startAudio();
  let stream=canvas.captureStream(25);
  audio.recordDestination.stream.getAudioTracks()
   .forEach(t=>stream.addTrack(t));

  let type=MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
   ?"video/webm;codecs=vp9":"video/webm";

  recorder=new MediaRecorder(stream,{mimeType:type});
  recorder.ondataavailable=e=>{
   if(e.data.size)chunks.push(e.data);
  };

  recorder.onstop=()=>{
   let blob=new Blob(chunks,{type:"video/webm"});
   let url=URL.createObjectURL(blob);
   let a=document.createElement("a");
   a.href=url;a.download="Pyasa-Kauwa.webm";
   a.click();
   setTimeout(()=>URL.revokeObjectURL(url),5000);
   if(audio){audio.close();audio=null;}
   document.getElementById("status").innerText="Video download ho gaya!";
   document.getElementById("start").disabled=false;
   document.getElementById("stop").disabled=true;
  };

  recorder.start();
  document.getElementById("start").disabled=true;
  document.getElementById("stop").disabled=false;
  document.getElementById("status").innerText="Cartoon video ban raha hai...";
  render();
 }catch(e){
  running=false;
  if(audio){audio.close();audio=null;}
  alert("Error: "+e.message);
 }
}

function stopVideo(){
 if(!running)return;
 running=false;
 cancelAnimationFrame(animation);
 if(recorder&&recorder.state!=="inactive")recorder.stop();
 document.getElementById("status").innerText="Download taiyar ho raha hai...";
}

function playVoice(){
 if(!window.speechSynthesis){
  alert("Hindi voice available nahi hai.");
  return;
 }
 speechSynthesis.cancel();
 let i=0;
 function next(){
  if(i>=story.length)return;
  let u=new SpeechSynthesisUtterance(story[i++]);
  u.lang="hi-IN";
  u.rate=.85;
  u.onend=next;
  speechSynthesis.speak(u);
 }
 next();
}
setup();
</script>
</body>
</html>
