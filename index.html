<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Story Video Maker</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:18px;
  background:#101827;
  color:white;
  font-family:Arial,sans-serif;
}
.app{
  max-width:650px;
  margin:auto;
}
h1{color:#65e6b4;text-align:center}
p{color:#cbd5e1;line-height:1.5}
label{
  display:block;
  margin-top:16px;
  margin-bottom:7px;
  font-weight:bold;
}
input,select{
  width:100%;
  padding:13px;
  border-radius:9px;
  border:1px solid #475569;
  background:#1e293b;
  color:white;
  font-size:16px;
}
button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:0;
  border-radius:9px;
  background:#20c997;
  color:#06251d;
  font-size:16px;
  font-weight:bold;
}
.scene{
  background:#1e293b;
  border:1px solid #475569;
  border-radius:12px;
  padding:15px;
  margin-top:14px;
}
.scene h3{color:#65e6b4}
.scene p{white-space:pre-wrap}
.small{
  background:#334155;
  color:white;
}
#results{margin-top:20px}
</style>
</head>

<body>
<div class="app">

<h1>🎬 Free Story Video Maker</h1>
<p>Apna topic likhiye. App aapke liye kahani aur alag-alag scenes taiyar karega.</p>

<label>Video Category</label>
<select id="category">
<option>Cartoon Story</option>
<option>Animal Story</option>
<option>Islamic Story</option>
<option>Comedy Story</option>
<option>Adventure Story</option>
<option>Educational Video</option>
<option>Nature Video</option>
</select>

<label>Kahani ka Topic</label>
<input id="topic" placeholder="Jaise: Ek sher aur ek chhota bachcha">

<label>Voice Language</label>
<select id="language">
<option value="hi-IN">Hindi</option>
<option value="ur-PK">Urdu</option>
<option value="en-US">English</option>
</select>

<label>Video Size</label>
<select id="ratio">
<option value="9:16">9:16 - Shorts / Reels</option>
<option value="16:9">16:9 - YouTube Long</option>
</select>

<button onclick="makeStory()">✨ Kahani Banao</button>

<div id="results"></div>

</div>

<script>
let scenes = [];

function makeStory(){

 const topic = document.getElementById("topic").value.trim();
 const category = document.getElementById("category").value;

 if(!topic){
   alert("Pehle kahani ka topic likhiye.");
   return;
 }

 const title = topic;
 const categoryText = category;

 scenes = [
  {
   heading:"Scene 1 - Shuruaat",
   narration:"Ek din ki baat hai. "+topic+". Is kahani ki shuruaat ek dilchasp jagah se hoti hai.",
   visual:"Show the opening scene of "+topic+". Establish the location, characters and atmosphere. "+categoryText+" style."
  },
  {
   heading:"Scene 2 - Nayi Pareshani",
   narration:"Kuch der baad ek nayi pareshani saamne aati hai. Ab sabke saamne ek bada sawaal hai ki aage kya hoga.",
   visual:"Show a new challenge or surprising event connected to "+topic+". "+categoryText+" style."
  },
  {
   heading:"Scene 3 - Koshish",
   narration:"Lekin himmat nahi haari jaati. Kirdar apni samajh aur himmat se hal dhoondhne ki koshish karta hai.",
   visual:"Show the main character trying to solve the problem. Expressive scene, cinematic composition."
  },
  {
   heading:"Scene 4 - Anjaam",
   narration:"Aakhirkaar koshish rang laati hai. Kahani ek naye mod par pahunchti hai aur sabko ek achhi seekh milti hai.",
   visual:"Show the conclusion of "+topic+". A meaningful and satisfying ending. "+categoryText+" style."
  }
 ];

 let html = "<h2>📖 Aapki Kahani: "+escapeHTML(title)+"</h2>";
 html += "<p>Category: "+escapeHTML(categoryText)+"</p>";

 scenes.forEach((scene,index)=>{
   html += `
   <div class="scene">
    <h3>${scene.heading}</h3>
    <p><b>Voice / Narration:</b><br>${escapeHTML(scene.narration)}</p>
    <p><b>Image Prompt:</b><br>${escapeHTML(scene.visual)}</p>
    <button class="small" onclick="speakScene(${index})">🔊 Voice Suno</button>
   </div>`;
 });

 html += `
 <button onclick="downloadStory()">⬇️ Kahani Download Karo</button>
 <p>Agla kaam: Har scene ke Image Prompt se alag image banakar video editor mein jodiye.</p>
 `;

 document.getElementById("results").innerHTML = html;
}

function speakScene(index){
 if(!("speechSynthesis" in window)){
   alert("Is browser mein voice feature available nahi hai.");
   return;
 }
 speechSynthesis.cancel();
 let speech = new SpeechSynthesisUtterance(scenes[index].narration);
 speech.lang = document.getElementById("language").value;
 speech.rate = 0.9;
 speechSynthesis.speak(speech);
}

function downloadStory(){
 let text = "MY STORY VIDEO PLAN\n\n";
 scenes.forEach(scene=>{
   text += scene.heading+"\n";
   text += "Narration: "+scene.narration+"\n";
   text += "Image Prompt: "+scene.visual+"\n\n";
 });

 let file = new Blob([text],{type:"text/plain;charset=utf-8"});
 let url = URL.createObjectURL(file);
 let a = document.createElement("a");
 a.href = url;
 a.download = "my-story-plan.txt";
 a.click();
 URL.revokeObjectURL(url);
}

function escapeHTML(value){
 return value.replace(/[&<>"']/g, function(ch){
   return {
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
   }[ch];
 });
}
</script>
</body>
</html>
